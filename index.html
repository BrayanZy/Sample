<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09090b">
<title>Una sorpresa para ti</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{min-height:100vh;display:grid;place-items:center;overflow:hidden;color:#fff;background:radial-gradient(circle at 50% 35%,#27272a 0,#09090b 58%,#000 100%)}
.card{text-align:center;padding:2rem 1.4rem;max-width:700px;position:relative;z-index:2}
.small{letter-spacing:.22em;text-transform:uppercase;color:#a1a1aa;font-size:.78rem}
h1{font-size:clamp(2.3rem,9vw,5.6rem);line-height:1.06;margin:1rem 0;font-weight:900;opacity:0;transform:scale(.65) rotate(-4deg);text-shadow:0 0 24px #ffffff33;animation:reveal .9s cubic-bezier(.2,1.5,.4,1) .5s forwards}
button{margin-top:1.4rem;border:1px solid #52525b;background:#18181b;color:white;padding:.85rem 1.2rem;border-radius:999px;font-size:1rem;cursor:pointer}
#extra{min-height:2rem;color:#d4d4d8;margin-top:1rem}
.spark{position:fixed;top:-20px;font-size:1.2rem;animation:fall linear forwards;pointer-events:none}
@keyframes reveal{to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.1}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<main class="card">
  <div class="small">MENSAJE IMPORTANTE</div>
  <h1>Fíjate que no me importaaaaaaaaaaaa</h1>
  <div>🙂‍↔️</div>
  <button id="btn" type="button">¿DELIVERY GRATIS? 👀</button>
  <div id="extra" aria-live="polite"></div>
</main>
<script>
const extra=document.querySelector('#extra');
document.querySelector('#btn').addEventListener('click',()=>{
 extra.textContent='JAJAJA, DENUNCIAME PEE';
 for(let i=0;i<24;i++){
  const s=document.createElement('span');s.className='spark';
  s.textContent=['💀','😂','✨','🫠'][Math.floor(Math.random()*4)];
  s.style.left=Math.random()*100+'vw';
  s.style.animationDuration=(2+Math.random()*3)+'s';
  s.style.animationDelay=(Math.random()*.5)+'s';
  document.body.appendChild(s);setTimeout(()=>s.remove(),6000);
 }
});
</script>
</body>
</html>
